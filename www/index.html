
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToonWorld AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:20px;
 background:#17102e;
 color:white;
 font-family:Arial,sans-serif;
}
h1{color:#ffcf5a;text-align:center}
.card{
 background:#292044;
 padding:22px;
 border-radius:18px;
 margin:18px 0;
}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 background:#a855f7;
 color:white;
 font-size:17px;
}
</style>
</head>
<body>
<h1>🎬 ToonWorld AI</h1>
<p style="text-align:center">Your Personal Cartoon Studio</p>

<div class="card">
<h2>🎨 Image Studio</h2>
<p>Create your own cartoon characters.</p>
<button onclick="alert('Image Studio Ready!')">
Create Cartoon
</button>
</div>

<div class="card">
<h2>🎥 Video Studio</h2>
<p>Create amazing cartoon stories.</p>
<button onclick="alert('Video Studio Ready!')">
Create Video
</button>
</div>

<div class="card">
<h2>🧑 Character Library</h2>
<p>Your saved cartoon characters.</p>
</div>
</body>
</html>
